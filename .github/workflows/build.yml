name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config fcitx5-dev librime-dev rime-data
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
      - name: Build fcitx5 module
        run: ./scripts/build.sh
      - name: Build daemon
        run: cd daemon && go vet ./... && go build ./...
      - name: Check rime data present
        run: ls /usr/share/rime-data/luna_pinyin.schema.yaml
